[build-system]
requires = [
    # 77.0 is the first release to understand the PEP 639 SPDX "license" field.
    "setuptools >= 77.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "bezpy"
authors = [
    {name = "Greg Lucas"},
]
description = "Geomagnetic field (B), Geoelectric field (E), and Magnetotelluric Impedance (Z) Python routines."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["geomagnetic", "geoelectric", "GIC", "hazard analysis"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    'Development Status :: 4 - Beta',
    'Framework :: Matplotlib',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: POSIX :: AIX',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: GIS',
    'Topic :: Scientific/Engineering :: Visualization',
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "shapely>=2.0",
]
dynamic = ["version"]

[project.optional-dependencies]
# Plotting routines (Site.plot_apparent_resistivity, mt.plotting)
plotting = ["matplotlib>=3.5"]
# Reading/writing downloaded IRIS waveforms to HDF5 (Site3d.save/load_waveforms)
waveforms = ["tables>=3.7"]
# Downloading raw waveforms from the IRIS/EarthScope FDSN service
iris = ["obspy>=1.3"]
# Data acquisition and caching (bezpy.data): download/store observatory data,
# cache management, and the netCDF archive (h5netcdf is a pure-Python engine)
data = ["pooch>=1.6", "xarray>=2023.1", "h5netcdf>=1.0", "h5py>=3.0", "requests>=2.25"]
# Everything needed to run the example command-line scripts in scripts/
scripts = ["matplotlib>=3.5", "requests>=2.25", "pysecs>=0.1"]
# Test and lint tooling (pulls in the data stack so bezpy.data tests run)
test = ["pytest>=7.0", "pytest-cov", "ruff", "bezpy[data]"]

[project.urls]
homepage = 'https://github.com/greglucas/bezpy'

[tool.setuptools.dynamic]
version = {attr = "bezpy.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["bezpy*"]
exclude = ["notebooks", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, numpy-specific rules
select = ["E", "F", "I", "UP", "NPY"]
ignore = [
    "E741",  # ambiguous variable names (l, I) are common in the geophysics here
    "E501",  # line length handled by the formatter/line-length above
]

[tool.ruff.lint.per-file-ignores]
# Star-imports are how the public API is assembled in the package __init__s.
"bezpy/**/__init__.py" = ["F401", "F403"]
